name: Dashboard Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Test shell, CLI config helper, and dashboard
        run: |
          bash -n configure_mavlink_router.sh install_mavlink_router.sh mavlink-router-cli.sh lib/*.sh scripts/*.sh
          python3 -m unittest discover -s tests -v
          cd dashboard
          go test ./...

      - name: Build and smoke-test dashboard assets
        run: ./scripts/build_release_assets.sh "$PWD/build"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mavlink-anywhere-dashboard-assets
          path: build/mavlink-anywhere-linux-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mavlink-anywhere-dashboard-assets/mavlink-anywhere-linux-arm6
            mavlink-anywhere-dashboard-assets/mavlink-anywhere-linux-arm64
            mavlink-anywhere-dashboard-assets/mavlink-anywhere-linux-amd64
          generate_release_notes: true
